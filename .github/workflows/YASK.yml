name: "Build YASK"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      test_only:
        description: "Build and package without publishing a release or notifications"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yask-${{ github.workflow }}
  cancel-in-progress: false
        
jobs:
  build-kernels:
    name: "🐎 Build YASK ${{ matrix.kernel.name }} kernel"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-YASK-GKI"
            output_name: "Image.gki.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "CLO"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"
            defconfig: "gki_defconfig"
            local_version: "-YASK-CLO"
            output_name: "Image.clo.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
            defconfig: "gki_defconfig"
            local_version: "-YAS-GKI"
            output_name: "Image.gki.noksu"
            enable_ksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "CLO-NoKSU"
            dir: "common_clo_noksu"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"
            defconfig: "gki_defconfig"
            local_version: "-YASK-CLO"
            output_name: "Image.clo.noksu"
            enable_ksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}
      VARIANT: ${{ matrix.kernel.name }}
      ENABLE_KSU: ${{ matrix.kernel.enable_ksu }}
      ARTIFACT_DIR: ${{ github.workspace }}/yask-artifact
      METADATA_DIR: ${{ github.workspace }}/yask-artifact/metadata

    steps:
      - name: "📥 Checkout build patches"
        uses: actions/checkout@v7

      - name: "✨ Setup workspace"
        run: |
          mkdir -p "${{ env.KERNEL_LOC_DIR }}" "$METADATA_DIR/patches"
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: 📐 Setup SWAP 10GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 10
            
      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      - name: "📥 Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Initialize AOSP repo
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8
          
          # Preserve the exact AOSP build/toolchain revisions before cleanup.
          repo manifest -r -o "$METADATA_DIR/aosp-manifest.xml"

          # Clean up existing repo and common directories
          rm -rf .repo
          rm -rf common

          # Download and setup custom clang toolchain
          CLANG_URL="https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz "$CLANG_URL"
          printf '%s\n' "$CLANG_URL" > "$METADATA_DIR/clang-source.url"
          sha256sum prebuilts/clang/host/linux-x86/clang-r547379.tar.gz > "$METADATA_DIR/clang-archive.sha256"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz
          prebuilts/clang/host/linux-x86/clang-r547379/bin/clang --version > "$METADATA_DIR/clang-version.txt"

          # Remove unused clang for more space
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable
          
          # Update build config constants
          sed -i \
           -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
           -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
           ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants
          
          # Remove defconfig check (if exists)
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      - name: "🧩 Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}\"" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

          # Helper
          apply_patch() {
            local url="$1"
            local file
            file=$(basename "$url")
            curl -fsSL --retry 3 -o "$file" "$url"
            patch --batch --forward --dry-run -p1 < "$file"
            patch --batch --forward -p1 < "$file"
            cp "$file" "$METADATA_DIR/patches/"
            printf '%s\t%s\n' "$file" "$url" >> "$METADATA_DIR/patch-sources.tsv"
            rm -f "$file"
          }

          # Apply patches
          echo '${{ toJSON(matrix.kernel.extra_patches) }}' | jq -r '.[]' | while IFS= read -r p; do
            apply_patch "$p"
          done

      - name: "🔧 Add BBG Support (KSU variant only)"
        if: matrix.kernel.enable_ksu == true
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "Adding BBG...";
          wget -O "$METADATA_DIR/bbg-setup.sh" https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh
          bash "$METADATA_DIR/bbg-setup.sh"
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: "🔧 Setup BakaSU with SUSFS"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu

          echo "📦 Installing KSU..."
          curl -fsSL "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" -o "$METADATA_DIR/bakasu-setup.sh"
          bash "$METADATA_DIR/bakasu-setup.sh" main
          
          echo "✔ KSU installed successfully"
          
          # Clone SUSFS4KSU for kernel patches only (not KSU integration)
          echo "📦 Cloning SUSFS4KSU for kernel patches..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          git -C susfs4ksu rev-parse HEAD > "$METADATA_DIR/susfs.commit"
          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          cp "$SUSFS_KERNEL_PATCH" "$METADATA_DIR/patches/susfs-kernel.patch"

          # The include hunks require the original Android trace-hook headers.
          # Check the entire patch before applying it; copied source files cannot
          # repair missing hooks, declarations or build wiring after a rejection.
          echo "🔧 Applying SUSFS kernel patch..."
          patch --batch --forward --dry-run -p1 < "$SUSFS_KERNEL_PATCH"
          patch --batch --forward -p1 < "$SUSFS_KERNEL_PATCH"

          echo "📄 Installing SUSFS sources and headers..."
          
          # Always replace fs/susfs.c
          mkdir -p fs
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          echo "✔ Copied fs/susfs.c"
          
          # Always replace include/linux/susfs.h
          mkdir -p include/linux
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          echo "✔ Copied include/linux/susfs.h"
          
          cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

          # BakaSU does not expose SUSFS's optional priority UID filter.
          # Compile its credential helpers only when that feature is enabled.
          COMPAT_PATCH="${{ github.workspace }}/.github/patches/susfs-optional-uid-filter.patch"
          patch --batch --forward --dry-run -p1 < "$COMPAT_PATCH"
          patch --batch --forward -p1 < "$COMPAT_PATCH"
          cp "$COMPAT_PATCH" "$METADATA_DIR/patches/"

          # Clean up SUSFS repo (we only needed kernel patches, not KSU integration)
          rm -rf susfs4ksu
          
          # BakaSU's setup script links drivers/kernelsu to KernelSU/kernel.
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          echo "✅ KSU configs added"

          echo "🎉 BakaSU installed and SUSFS for GKI android13-5.15 fully integrated!"

      - name: "⚙️ Setup basic configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          # addon configs
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          EOF
          
          echo "✅ Basic configs added"

      - name: "📝 Append custom Makefile line"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
         # echo 'KBUILD_CFLAGS += -Wno-default-const-init-unsafe' >> Makefile
         # echo 'KBUILD_CFLAGS += -Wno-uninitialized-const-pointer' >> Makefile
         echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile
         echo "Custom Makefile line added successfully"
    
      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          LTO=full \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "📁 Prepare image and build manifest"
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          workspace = Path(os.environ["WORK_DIR"])
          kernel = workspace / os.environ["KERNEL_LOC_DIR"] / os.environ["KERNEL_NAME"]
          artifact = Path(os.environ["ARTIFACT_DIR"])
          metadata = Path(os.environ["METADATA_DIR"])
          build_dir = workspace / "out" / os.environ["KERNEL_LOC_DIR"] / os.environ["KERNEL_NAME"]
          image = workspace / "out/dist/Image"
          if not image.is_file() or image.stat().st_size == 0:
              raise SystemExit("Kernel Image is missing or empty")
          with image.open("rb") as stream:
              if stream.read(64)[56:60] != b"ARM\x64":
                  raise SystemExit("Kernel Image does not have an ARM64 header")
          config = workspace / "out/dist/.config"
          if not config.is_file():
              config = build_dir / ".config"
          if not config.is_file() or config.stat().st_size == 0:
              raise SystemExit("Effective kernel .config is missing or empty")
          shutil.copy2(image, artifact / os.environ["OUTPUT_NAME"])
          shutil.copy2(config, metadata / "kernel.config")

          def sha256(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          def source(path, repository, branch=None):
              commit = subprocess.check_output(["git", "-C", str(path), "rev-parse", "HEAD"], text=True).strip()
              return {"repository": repository, "branch": branch, "commit": commit}

          ksu = os.environ["ENABLE_KSU"] == "true"
          patch_sources = dict(line.split("\t", 1) for line in (metadata / "patch-sources.tsv").read_text().splitlines())
          patches = [{"file": "patches/" + path.name, "source": patch_sources.get(path.name), "sha256": sha256(path)}
                     for path in sorted((metadata / "patches").glob("*.patch"))]
          manifest = {
              "schema_version": 1,
              "variant": os.environ["VARIANT"],
              "workflow": {
                  "repository": os.environ["GITHUB_REPOSITORY"], "commit": os.environ["GITHUB_SHA"],
                  "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              },
              "kernel": {
                  **source(kernel, os.environ["KERNEL_REPO"], os.environ["KERNEL_BRANCH"]),
                  "version": subprocess.check_output(["make", "-s", "kernelversion"], cwd=kernel, text=True).strip(),
                  "release": (build_dir / "include/config/kernel.release").read_text().strip(),
              },
              "bakasu": source(kernel / "KernelSU", "https://github.com/Baka-SU/BakaSU", "main") if ksu else None,
              "susfs": {"repository": "https://gitlab.com/simonpunk/susfs4ksu.git", "branch": "gki-android13-5.15",
                        "commit": (metadata / "susfs.commit").read_text().strip()} if ksu else None,
              "baseband_guard": source(kernel / "Baseband-guard", "https://github.com/vc-teahouse/Baseband-guard", "main") if ksu else None,
              "toolchain": {
                  "clang_version": (metadata / "clang-version.txt").read_text().strip(),
                  "archive_url": (metadata / "clang-source.url").read_text().strip(),
                  "archive_sha256": (metadata / "clang-archive.sha256").read_text().split()[0],
                  "aosp_manifest": "aosp-manifest.xml", "aosp_manifest_sha256": sha256(metadata / "aosp-manifest.xml"),
              },
              "build": {"lto": "full", "config": "kernel.config", "config_sha256": sha256(metadata / "kernel.config")},
              "patches": patches,
              "setup_scripts": {path.name: sha256(path) for path in sorted(metadata.glob("*-setup.sh"))},
              "image": {"name": os.environ["OUTPUT_NAME"], "size": image.stat().st_size, "sha256": sha256(image)},
          }
          (metadata / "build.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(f'Prepared {manifest["variant"]}: {manifest["kernel"]["release"]}')
          PY

      - name: "📤 Upload kernel artifact"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.kernel.name }}-kernel
          path: ${{ env.ARTIFACT_DIR }}/
          if-no-files-found: error
          retention-days: 3

  package-kernels:
    name: "📦 Package Kernels"
    runs-on: ubuntu-24.04
    needs: [build-kernels]
    permissions:
      contents: write
    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}
      release_url: ${{ steps.package.outputs.release_url }}
    env:
      RELEASE_TAG: YASK-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: "📥 Download kernel artifacts"
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts/

      - name: "📦 Validate and create release package"
        id: package
        run: |
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b YASK AnyKernel3

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          root = Path("AnyKernel3")
          expected = {"Image.gki.ksu": "GKI", "Image.gki.noksu": "GKI-NoKSU",
                      "Image.clo.ksu": "CLO", "Image.clo.noksu": "CLO-NoKSU"}

          def sha256(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          builds = []
          # Validate the entire set before copying any kernel into the installer.
          for image, variant in expected.items():
              matches = list(Path("artifacts").rglob(image))
              if len(matches) != 1 or not matches[0].is_file() or matches[0].stat().st_size == 0:
                  raise SystemExit(f"Expected exactly one non-empty {image}, found {len(matches)}")
              source = matches[0]
              metadata = source.parent / "metadata"
              manifest = json.loads((metadata / "build.json").read_text())
              if manifest["variant"] != variant or manifest["image"]["name"] != image:
                  raise SystemExit(f"Variant mismatch for {image}")
              if manifest["workflow"]["run_id"] != os.environ["GITHUB_RUN_ID"] or manifest["workflow"]["commit"] != os.environ["GITHUB_SHA"]:
                  raise SystemExit(f"Build provenance mismatch for {image}")
              if manifest["image"]["sha256"] != sha256(source) or manifest["image"]["size"] != source.stat().st_size:
                  raise SystemExit(f"Image checksum/size mismatch for {image}")
              if manifest["build"]["config_sha256"] != sha256(metadata / "kernel.config"):
                  raise SystemExit(f"Config checksum mismatch for {image}")
              if manifest["toolchain"]["aosp_manifest_sha256"] != sha256(metadata / manifest["toolchain"]["aosp_manifest"]):
                  raise SystemExit(f"AOSP manifest checksum mismatch for {image}")
              for patch in manifest["patches"]:
                  if patch["sha256"] != sha256(metadata / patch["file"]):
                      raise SystemExit(f"Patch checksum mismatch for {image}: {patch['file']}")
              for script, digest in manifest["setup_scripts"].items():
                  if digest != sha256(metadata / script):
                      raise SystemExit(f"Setup script checksum mismatch for {image}: {script}")
              builds.append((source, metadata, manifest))
          for source, metadata, manifest in builds:
              shutil.copy2(source, root / source.name)
              shutil.copytree(metadata, root / "metadata" / manifest["variant"], dirs_exist_ok=True)
          if {path.name for path in root.glob("Image.*")} != set(expected):
              raise SystemExit("Installer contains unexpected kernel images")
          package_manifest = {
              "schema_version": 1,
              "workflow": builds[0][2]["workflow"],
              "package_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "release_tag": os.environ["RELEASE_TAG"],
              "anykernel3": {"repository": "https://github.com/topnotchfreaks/AnyKernel3", "branch": "YASK",
                             "commit": subprocess.check_output(["git", "-C", str(root), "rev-parse", "HEAD"], text=True).strip()},
              "kernels": [manifest for _, _, manifest in builds],
          }
          (root / "BUILD-MANIFEST.json").write_text(json.dumps(package_manifest, indent=2) + "\n")
          files = [root / name for name in expected] + [root / "BUILD-MANIFEST.json"]
          files += [path for path in (root / "metadata").rglob("*") if path.is_file()]
          (root / "SHA256SUMS").write_text("".join(f"{sha256(path)}  {path.relative_to(root)}\n" for path in sorted(files)))
          print("Validated all four kernel images, manifests and effective configs")
          PY

          # Create banner
          cat > AnyKernel3/banner << 'EOF'
          ╔═════════════════════════════════════════════════════╗
          ║                                                     ║
          ║          ██╗   ██╗ █████╗ ███████╗██╗  ██╗          ║
          ║          ╚██╗ ██╔╝██╔══██╗██╔════╝██║ ██╔╝          ║
          ║           ╚████╔╝ ███████║███████╗█████╔╝           ║
          ║            ╚██╔╝  ██╔══██║╚════██║██╔═██╗           ║
          ║             ██║   ██║  ██║███████║██║  ██╗          ║
          ║             ╚═╝   ╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝          ║
          ║                                                     ║
          ║               Yet Another Stock Kernel              ║
          ║                   by @belowzeroiq                   ║
          ║                                                     ║
          ║              Powered by Github Actions              ║
          ║                                                     ║
          ╠═════════════════════════════════════════════════════╣
          ║                                                     ║
          ║     Features:                                       ║
          ║     • Full LTO + -O2 Optimization                   ║
          ║     • Extra TCP Congestion (BBR, Westwood)          ║
          ║     • AOSP clang-r547379                            ║
          ║     • Non-KSU & BakaSU + SUSFS support              ║
          ║     • Baseband-Guard Support                        ║
          ║     • Metamodule Support                            ║
          ║                                                     ║
          ║     Info:                                           ║
          ║     • Supported Android: 13-17                      ║
          ║     • Supported Device:                             ║
          ║       Redmi Note 12 4G/NFC                          ║
          ║       Redmi Note 13 4G/NFC                          ║
          ║       Redmi Pad SE                                  ║
          ║                                                     ║
          ║     Please ensure:                                  ║
          ║     • Your device is compatible                     ║
          ║     • You have a backup of your current kernel      ║
          ║                                                     ║
          ╚═════════════════════════════════════════════════════╝
          Installing YASK Kernel...
          EOF

          ZIP_NAME="Anykernel3_YASK-BakaSU-AIO-FULL_$(date +'%Y-%m-%d')_${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          cd AnyKernel3
          sha256sum -c SHA256SUMS
          zip -r9 "../$ZIP_NAME" * -x '.git/*'
          cd ..
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "release_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: "📤 Upload release package artifact"
        uses: actions/upload-artifact@v7
        with:
          name: YASK-package
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          if-no-files-found: error
          retention-days: 3

      - name: "⬆️ Upload to GitHub Release"
        if: ${{ !inputs.test_only }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          fail_on_unmatched_files: true
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}

  notify:
    name: "📱 Report build result"
    runs-on: ubuntu-24.04
    needs: [build-kernels, package-kernels]
    if: ${{ always() && !cancelled() }}
    env:
      TEST_ONLY: ${{ inputs.test_only == true }}
      BUILD_RESULT: ${{ needs.build-kernels.result }}
      PACKAGE_RESULT: ${{ needs.package-kernels.result }}
      RELEASE_URL: ${{ needs.package-kernels.outputs.release_url }}
      ZIP_NAME: ${{ needs.package-kernels.outputs.zip_name }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_YASK_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      BANNER_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/assets/yask.png
    steps:
      - name: "Prepare result message"
        run: |
          LOG_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$BUILD_RESULT" == "success" && "$PACKAGE_RESULT" == "success" ]]; then
            DOWNLOAD_URL="$RELEASE_URL"
            BUILD_LABEL="YASK kernel build successful"
            if [[ "$TEST_ONLY" == "true" ]]; then
              DOWNLOAD_URL="$LOG_URL"
              BUILD_LABEL="YASK kernel test build successful (artifacts only)"
            fi
            MESSAGE="✅ $BUILD_LABEL
          GKI & CLO • BakaSU + SUSFS • Full LTO
          Package: $ZIP_NAME
          Download: $DOWNLOAD_URL
          Logs: $LOG_URL"
          else
            MESSAGE="❌ YASK kernel build failed
          Build: $BUILD_RESULT
          Package/release: $PACKAGE_RESULT
          Logs: $LOG_URL"
          fi
          printf '%s\n' "$MESSAGE" > notification.txt
          cat notification.txt >> "$GITHUB_STEP_SUMMARY"

      - name: "Send Telegram notification"
        if: ${{ !inputs.test_only && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != '' }}
        run: |
          curl -fsS --max-time 30 -X POST \
            --data-urlencode "chat_id=$TELEGRAM_CHANNEL_ID" \
            --data-urlencode "photo=$BANNER_URL" \
            --data-urlencode "caption=$(cat notification.txt)" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" > telegram-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          response = json.loads(Path("telegram-response.json").read_text())
          if not response.get("ok"):
              raise SystemExit("Telegram API rejected the notification: " + str(response.get("description", "unknown error")))
          PY
