name: "Build GKI Kernel 5.15"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  workflow_dispatch:
    inputs:
      root_solution:
        description: "Root Solution"
        required: true
        type: choice
        default: "kittisu"
        options:
          - kittisu
          - resukisu
          - none
      ksu_branch:
        description: "KSU branch (e.g. main, dev, v1.0.0)"
        required: false
        default: "main"
      enable_susfs:
        description: "Enable SUSFS"
        required: true
        type: boolean
        default: true
      enable_bbg:
        description: "Enable Baseband Guard"
        required: true
        type: boolean
        default: true

      enable_security_hardening:
        description: "Security hardening (SELinux, CFI)"
        required: true
        type: boolean
        default: false
      device_codename:
        description: "Device codename → {codename}_defconfig. Empty = gki_defconfig"
        required: false
        default: ""
      kernel_name:
        description: "Kernel name suffix"
        required: false
        default: "GKI-Custom"
      lto_type:
        description: "LTO type"
        required: true
        type: choice
        default: "thin"
        options:
          - thin
          - full
          - none

permissions:
  contents: write

jobs:
  build-kernels:
    name: "🐎 Build ${{ matrix.kernel.name }} (${{ github.event.inputs.root_solution }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
          - name: "CLO"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      WORK_DIR: ${{ github.workspace }}
      ROOT_SOLUTION: ${{ github.event.inputs.root_solution }}

    steps:
      # ──────────────────────────────────────────────
      # 1. Setup workspace & dependencies
      # ──────────────────────────────────────────────
      - name: "✨ Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

          # Determine defconfig from device codename
          CODENAME="${{ github.event.inputs.device_codename }}"
          if [ -n "$CODENAME" ]; then
            echo "DEFCONFIG_NAME=${CODENAME}_defconfig" >> $GITHUB_ENV
          else
            echo "DEFCONFIG_NAME=gki_defconfig" >> $GITHUB_ENV
          fi

          # Determine root suffix & output name
          ROOT="${{ env.ROOT_SOLUTION }}"
          KNAME="${{ matrix.kernel.name }}"
          if [ "$ROOT" = "none" ]; then
            echo "LOCAL_VERSION=-${{ github.event.inputs.kernel_name }}-${KNAME}" >> $GITHUB_ENV
            echo "OUTPUT_NAME=Image.${KNAME,,}.noksu" >> $GITHUB_ENV
          else
            echo "LOCAL_VERSION=-${{ github.event.inputs.kernel_name }}-${KNAME}-${ROOT}" >> $GITHUB_ENV
            echo "OUTPUT_NAME=Image.${KNAME,,}.${ROOT}" >> $GITHUB_ENV
          fi

      - name: "📐 Setup SWAP 10GB"
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: "📐 Tune Swap"
        run: |
          echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      # ──────────────────────────────────────────────
      # 2. Clone kernel source
      # ──────────────────────────────────────────────
      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      # ──────────────────────────────────────────────
      # 3. Initialize AOSP repo & toolchains
      # ──────────────────────────────────────────────
      - name: "📥 Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Initialize AOSP repo for build scripts & prebuilts
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8

          # Clean up repo metadata and common (we use our own source)
          rm -rf .repo
          rm -rf common

          # Download and setup custom clang toolchain (r547379)
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz \
            "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          # Remove unused clang versions to save space
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable

          # Update build config constants to use new clang
          sed -i \
            -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
            -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants

          # Remove defconfig check (if exists)
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      # ──────────────────────────────────────────────
      # 4. Configure kernel
      # ──────────────────────────────────────────────
      - name: "🧩 Configure kernel"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}\"" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

      # ──────────────────────────────────────────────
      # 5. BBG (Baseband Guard)
      # ──────────────────────────────────────────────
      - name: "🔧 Add BBG Support"
        if: github.event.inputs.root_solution != 'none' && github.event.inputs.enable_bbg == 'true'
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "Adding BBG..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      # ──────────────────────────────────────────────
      # 6. Root Solution Setup
      # ──────────────────────────────────────────────
      - name: "🔧 Setup Root Solution (${{ env.ROOT_SOLUTION }})"
        if: github.event.inputs.root_solution != 'none'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu

          ROOT="${{ env.ROOT_SOLUTION }}"
          KSU_BRANCH="${{ github.event.inputs.ksu_branch }}"

          # Select the correct setup.sh URL based on root solution + branch
          if [ "$ROOT" = "resukisu" ]; then
            SETUP_URL="https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/${KSU_BRANCH}/kernel/setup.sh"
          elif [ "$ROOT" = "kittisu" ]; then
            SETUP_URL="https://raw.githubusercontent.com/terebiko/KittiSU/refs/heads/${KSU_BRANCH}/kernel/setup.sh"
          else
            echo "❌ Unknown root solution: $ROOT"
            exit 1
          fi

          echo "📦 Installing $ROOT (branch: $KSU_BRANCH)..."
          echo "📥 URL: $SETUP_URL"
          curl -LSs "$SETUP_URL" | bash -s "$KSU_BRANCH"
          echo "✔ $ROOT ($KSU_BRANCH) installed successfully"

      # ──────────────────────────────────────────────
      # 7. SUSFS integration
      # ──────────────────────────────────────────────
      - name: "🔧 Setup SUSFS"
        if: github.event.inputs.root_solution != 'none' && github.event.inputs.enable_susfs == 'true'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "📦 Cloning SUSFS4KSU..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          echo "☣️ Applying namespace.c Fake Patch (if applicable)"
          if grep -q '^#include <trace/hooks/blk.h>$' fs/namespace.c; then
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
            NS_FAKE_PATCHED=1
          else
            NS_FAKE_PATCHED=0
          fi

          echo "☣️ Applying task_mmu.c Fake Patch (if applicable)"
          if grep -q '^#include <trace/hooks/mm.h>$' fs/proc/task_mmu.c; then
            sed -i '/^#include <trace\/hooks\/mm.h>$/d' fs/proc/task_mmu.c
            MM_FAKE_PATCHED=1
          else
            MM_FAKE_PATCHED=0
          fi

          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

          echo "🔧 Applying SUSFS kernel patch..."
          patch -p1 < "$SUSFS_KERNEL_PATCH" || echo "⚠️ Patch failed — forcing manual copy"

          echo "📄 Forcing SUSFS source injection..."
          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          [ -f susfs4ksu/kernel_patches/include/linux/susfs_def.h ] && \
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h

          rm -rf susfs4ksu

          if [ ! -L "drivers/kernelsu" ]; then
            ln -sf ../KernelSU drivers/kernelsu
          fi

          # SUSFS configs
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          # Revert fake patches
          if [ "$NS_FAKE_PATCHED" = "1" ] && ! grep -q 'trace/hooks/blk.h' fs/namespace.c; then
            grep -q '^#include "internal.h"$' fs/namespace.c && \
              sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' fs/namespace.c
          fi
          if [ "$MM_FAKE_PATCHED" = "1" ] && ! grep -q 'trace/hooks/mm.h' fs/proc/task_mmu.c; then
            grep -q '^#include <linux/pkeys.h>$' fs/proc/task_mmu.c && \
              sed -i '/^#include <linux\/pkeys.h>$/a #include <trace/hooks/mm.h>' fs/proc/task_mmu.c
          fi

          echo "🎉 SUSFS integrated!"

      # ──────────────────────────────────────────────
      # 8. Kernel optimizations (toggleable)
      # ──────────────────────────────────────────────
      - name: "⚙️ Base configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_FHANDLE=y
          CONFIG_EPOLL=y
          CONFIG_SIGNALFD=y
          CONFIG_TIMERFD=y
          CONFIG_SCHED_AUTOGROUP=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_ZRAM=y
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          CONFIG_ZSMALLOC=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_LZ4HC=y
          CONFIG_CRYPTO_ZSTD=y
          EOF

          echo "✅ Base configs added"

      - name: "🔒 Security hardening"
        if: github.event.inputs.enable_security_hardening == 'true'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_SECURITY=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_HARDENED_USERCOPY=y
          CONFIG_FORTIFY_SOURCE=y
          CONFIG_INIT_STACK_ALL_ZERO=y
          CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
          CONFIG_RANDOMIZE_BASE=y
          CONFIG_STACKPROTECTOR=y
          CONFIG_STACKPROTECTOR_STRONG=y
          EOF

          echo "✅ Security hardening added"

      - name: "📝 Append custom Makefile line"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile
          echo "Custom Makefile line added successfully"

      # ──────────────────────────────────────────────
      # 9. Build kernel
      # ──────────────────────────────────────────────
      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          UPDATE_MODULES_LIST=1 \
          LTO=${{ github.event.inputs.lto_type }} \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "📁 Copy kernel image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "${{ env.OUTPUT_NAME }}"

      - name: "📤 Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.name }}-${{ github.event.inputs.root_solution }}-kernel
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 7

  # ════════════════════════════════════════════════
  # Package & Release
  # ════════════════════════════════════════════════
  package-kernels:
    name: "📦 Package Kernels"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    steps:
      - name: "📥 Download kernel artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "📦 Create AnyKernel3 flashable ZIP"
        run: |
          set -e

          ROOT="${{ github.event.inputs.root_solution }}"
          KNAME="${{ github.event.inputs.kernel_name }}"

          # Clone AnyKernel3 (osm0sis original — works with TWRP & kernel flash apps)
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          # Copy kernel images (use GKI as primary Image)
          GKI_IMAGE=$(find ./artifacts -path "*GKI*" -name "Image.*" | head -1)
          CLO_IMAGE=$(find ./artifacts -path "*CLO*" -name "Image.*" | head -1)

          if [ -n "$GKI_IMAGE" ]; then
            cp "$GKI_IMAGE" AnyKernel3/Image
          elif [ -n "$CLO_IMAGE" ]; then
            cp "$CLO_IMAGE" AnyKernel3/Image
          fi

          # Determine root display name
          case "$ROOT" in
            resukisu) ROOT_DISPLAY="ReSukiSU" ;;
            kittisu)  ROOT_DISPLAY="KittiSU" ;;
            none)     ROOT_DISPLAY="No Root" ;;
            *)        ROOT_DISPLAY="$ROOT" ;;
          esac

          KSU_BRANCH="${{ github.event.inputs.ksu_branch }}"

          # Configure anykernel.sh for GKI — universal flash (TWRP + app compatible)
          cat > AnyKernel3/anykernel.sh << 'AKEOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers
          # GKI 5.15 Kernel — Universal Flashable

          properties() { '
          kernel.string=GKI 5.15 Custom Kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=
          device.name2=
          device.name3=
          supported.versions=13-15
          supported.patchlevels=
          '; }

          # Shell variables
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          set_perm_recursive 0 0 755 644 $ramdisk;
          dump_boot;

          write_boot;
          AKEOF

          # Create ZIP
          ZIP_NAME="AnyKernel3_${KNAME}-${ROOT_DISPLAY}_${KSU_BRANCH}_$(date +'%Y-%m-%d').zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/* README.md *placeholder
          cd ..

          # Also create per-source ZIPs if both exist
          if [ -n "$GKI_IMAGE" ] && [ -n "$CLO_IMAGE" ]; then
            # GKI ZIP
            cp "$GKI_IMAGE" AnyKernel3/Image
            GKI_ZIP="AnyKernel3_${KNAME}-${ROOT_DISPLAY}_GKI_${KSU_BRANCH}_$(date +'%Y-%m-%d').zip"
            cd AnyKernel3 && zip -r9 "../$GKI_ZIP" * -x .git/* README.md *placeholder && cd ..

            # CLO ZIP
            cp "$CLO_IMAGE" AnyKernel3/Image
            CLO_ZIP="AnyKernel3_${KNAME}-${ROOT_DISPLAY}_CLO_${KSU_BRANCH}_$(date +'%Y-%m-%d').zip"
            cd AnyKernel3 && zip -r9 "../$CLO_ZIP" * -x .git/* README.md *placeholder && cd ..

            echo "ZIP_FILES=${GKI_ZIP}\n${CLO_ZIP}" >> $GITHUB_ENV
            echo "ZIP_NAME=$GKI_ZIP" >> $GITHUB_ENV
          else
            echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          fi

          echo "ROOT_DISPLAY=$ROOT_DISPLAY" >> $GITHUB_ENV
          echo "KSU_BRANCH=$KSU_BRANCH" >> $GITHUB_ENV
          echo "✅ Package created"

          # List all zips
          echo "📦 Created ZIPs:"
          ls -la *.zip

      - name: "⬆️ Upload to GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          files: AnyKernel3_*.zip
          tag_name: "kernel-${{ github.event.inputs.kernel_name }}-${{ github.event.inputs.root_solution }}-${{ github.event.inputs.ksu_branch }}"
          name: "${{ github.event.inputs.kernel_name }} - ${{ env.ROOT_DISPLAY }} (${{ env.KSU_BRANCH }})"
          body: |
            ## 📦 Kernel Build Info
            - **Root Solution**: ${{ env.ROOT_DISPLAY }}
            - **KSU Branch**: `${{ github.event.inputs.ksu_branch }}`
            - **SUSFS**: ${{ github.event.inputs.enable_susfs }}
            - **BBG**: ${{ github.event.inputs.enable_bbg }}
            - **LTO**: ${{ github.event.inputs.lto_type }}
            - **Kernel**: Linux 5.15 (GKI + CLO)
            - **Android**: 13+

            ## ⚡ Optimizations
            - **Security**: ${{ github.event.inputs.enable_security_hardening }}

            ## 📱 Flash Instructions
            ### TWRP / Custom Recovery
            1. Download the `.zip` file
            2. Reboot to recovery (TWRP/OrangeFox)
            3. Flash the zip
            4. Reboot

            ### Kernel Flash App (Franco Kernel Manager, EX Kernel Manager, etc.)
            1. Download the `.zip` file
            2. Open your kernel flash app
            3. Select the zip → Flash
            4. Reboot

            ### Fastboot
            1. Extract `Image` from the zip
            2. `fastboot flash boot Image`
            3. Reboot

      - name: "📤 Upload ZIP as artifact"
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-flashable-zips
          path: AnyKernel3_*.zip
          retention-days: 7

      - name: "📱 Send Telegram Notification"
        if: always()
        run: |
          ROOT="${{ env.ROOT_DISPLAY }}"
          KSU_BRANCH="${{ github.event.inputs.ksu_branch }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/kernel-${{ github.event.inputs.kernel_name }}-${{ github.event.inputs.root_solution }}-${KSU_BRANCH}"

          if [[ "${{ job.status }}" == "success" ]]; then
            MESSAGE="✅ *GKI 5.15 Kernel Released*

          📦 *Build Information:*
          • Kernel: \`Linux 5.15\`
          • Android: \`13+\`
          • Base: \`GKI & CLO\`
          • Root: \`${ROOT}\`
          • KSU Branch: \`${KSU_BRANCH}\`
          • SUSFS: \`${{ github.event.inputs.enable_susfs }}\`
          • BBG: \`${{ github.event.inputs.enable_bbg }}\`
          • LTO: \`${{ github.event.inputs.lto_type }}\`

          ⚡ *Optimizations:*
          • Security: \`${{ github.event.inputs.enable_security_hardening }}\`

          📱 *Flash via:* TWRP, OrangeFox, Franco KM, EX KM

          ⬇️ [Download Here]($RELEASE_URL)"

            curl -s -X POST \
              -d chat_id=${{ secrets.TELEGRAM_CHANNEL_ID }} \
              --data-urlencode "text=${MESSAGE}" \
              -d parse_mode="Markdown" \
              -d disable_web_page_preview="true" \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_YASK_BOT_TOKEN }}/sendMessage"

          else
            FAILURE_MSG="❌ *GKI 5.15 Kernel Build Failed*

          • Root: \`${ROOT}\` (${KSU_BRANCH})
          • 🔍 [Workflow Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

            curl -s -X POST \
              -d chat_id=${{ secrets.TELEGRAM_CHANNEL_ID }} \
              --data-urlencode "text=${FAILURE_MSG}" \
              -d parse_mode="Markdown" \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_YASK_BOT_TOKEN }}/sendMessage"
          fi
