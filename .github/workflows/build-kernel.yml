name: "Build GKI Kernel 5.15"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"

on:
  workflow_dispatch:
    inputs:
      root_solution:
        description: "Root Solution"
        required: true
        type: choice
        default: "resukisu"
        options:
          - resukisu
          - kittisu
          - none
      enable_susfs:
        description: "Enable SUSFS — WARNING: switches hook method to SUSFS Inline Hook (Kconfig choice), replacing Tracepoint Hook. This breaks Manager version detection (shows 0) and zygisk. Only enable if you need SUSFS hiding features and accept losing zygisk/Manager support."
        required: true
        type: boolean
        default: false
      enable_bbg:
        description: "Enable Baseband Guard (only works with root solution)"
        required: true
        type: boolean
        default: true
      device_codename:
        description: "Device codename (e.g. topaz, marble...) — defconfig = {codename}_defconfig. Leave empty for gki_defconfig"
        required: false
        default: ""
      kernel_name:
        description: "Custom kernel name suffix (e.g. MyKernel)"
        required: false
        default: "GKI-Custom"
      lto_type:
        description: "LTO type"
        required: true
        type: choice
        default: "full"
        options:
          - full
          - thin
          - none

permissions:
  contents: write

jobs:
  build-kernels:
    name: "🐎 Build ${{ matrix.kernel.name }} (${{ github.event.inputs.root_solution }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://android.googlesource.com/kernel/common"
            branch: "android13-5.15-lts"
          - name: "CLO"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://git.codelinaro.org/clo/la/kernel/msm-5.15.git"
            branch: "kernel.lnx.5.15.r1-rel"

    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      WORK_DIR: ${{ github.workspace }}
      ROOT_SOLUTION: ${{ github.event.inputs.root_solution }}

    steps:
      # ──────────────────────────────────────────────
      # 1. Setup workspace & dependencies
      # ──────────────────────────────────────────────
      - name: "✨ Setup workspace"
        run: |
          mkdir -p ${{ env.KERNEL_LOC_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

          # Determine defconfig from device codename
          CODENAME="${{ github.event.inputs.device_codename }}"
          if [ -n "$CODENAME" ]; then
            echo "DEFCONFIG_NAME=${CODENAME}_defconfig" >> $GITHUB_ENV
          else
            echo "DEFCONFIG_NAME=gki_defconfig" >> $GITHUB_ENV
          fi

          # Determine root suffix & output name
          ROOT="${{ env.ROOT_SOLUTION }}"
          KNAME="${{ matrix.kernel.name }}"
          if [ "$ROOT" = "none" ]; then
            echo "LOCAL_VERSION=-${{ github.event.inputs.kernel_name }}-${KNAME}" >> $GITHUB_ENV
            echo "OUTPUT_NAME=Image.${KNAME,,}.noksu" >> $GITHUB_ENV
          else
            echo "LOCAL_VERSION=-${{ github.event.inputs.kernel_name }}-${KNAME}-${ROOT}" >> $GITHUB_ENV
            echo "OUTPUT_NAME=Image.${KNAME,,}.${ROOT}" >> $GITHUB_ENV
          fi

      - name: "📐 Setup SWAP 10GB"
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: "📐 Tune Swap"
        run: |
          echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      # ──────────────────────────────────────────────
      # 2. Clone kernel source
      # ──────────────────────────────────────────────
      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1

      # ──────────────────────────────────────────────
      # 3. Initialize AOSP repo & toolchains
      # ──────────────────────────────────────────────
      - name: "📥 Initialize AOSP repo and toolchains"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          # Initialize AOSP repo for build scripts & prebuilts
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
          repo sync --optimized-fetch --prune -j8

          # Clean up repo metadata and common (we use our own source)
          rm -rf .repo
          rm -rf common

          # Download and setup custom clang toolchain (r547379)
          aria2c -x 16 -s 16 -o prebuilts/clang/host/linux-x86/clang-r547379.tar.gz \
            "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -rf prebuilts/clang/host/linux-x86/clang-r547379.tar.gz

          # Remove unused clang versions to save space
          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable

          # Update build config constants to use new clang
          sed -i \
            -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
            -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.constants

          # Remove defconfig check (if exists)
          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' \
            ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki || true

      # ──────────────────────────────────────────────
      # 4. Configure kernel & apply patches
      # ──────────────────────────────────────────────
      - name: "🧩 Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}\"" >> "$CONFIG_FILE"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$CONFIG_FILE"

          # Helper function
          apply_patch() {
            local url="$1"
            local file=$(basename "$url")
            curl -L -o "$file" "$url"
            patch -p1 < "$file" || echo "::warning::Hunks failed in $file"
            rm -f "$file"
          }

          # Apply common patches
          PATCHES=(
            "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
            "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-sign-builds.patch"
            "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
            "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          )

          for p in "${PATCHES[@]}"; do
            apply_patch "$p"
          done

      # ──────────────────────────────────────────────
      # 5. BBG (Baseband Guard) - only for root builds
      # ──────────────────────────────────────────────
      - name: "🔧 Add BBG Support"
        if: github.event.inputs.root_solution != 'none' && github.event.inputs.enable_bbg == 'true'
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo "Adding BBG..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      # ──────────────────────────────────────────────
      # 6. Root Solution Setup (ReSukiSU / KittiSU)
      # ──────────────────────────────────────────────
      - name: "🔧 Setup Root Solution (${{ env.ROOT_SOLUTION }})"
        if: github.event.inputs.root_solution != 'none'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu

          ROOT="${{ env.ROOT_SOLUTION }}"

          # Select the correct setup.sh URL based on root solution
          if [ "$ROOT" = "resukisu" ]; then
            SETUP_URL="https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh"
          elif [ "$ROOT" = "kittisu" ]; then
            SETUP_URL="https://raw.githubusercontent.com/terebiko/KittiSU/main/kernel/setup.sh"
          else
            echo "❌ Unknown root solution: $ROOT"
            exit 1
          fi

          echo "📦 Installing $ROOT using setup.sh..."
          curl -LSs "$SETUP_URL" | bash -s main
          echo "✔ $ROOT installed successfully"

      # ──────────────────────────────────────────────
      # 7. SUSFS integration (optional, only with root)
      # ──────────────────────────────────────────────
      - name: "🔧 Setup SUSFS"
        if: github.event.inputs.root_solution != 'none' && github.event.inputs.enable_susfs == 'true'
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          # Clone SUSFS4KSU for kernel patches
          echo "📦 Cloning SUSFS4KSU for kernel patches..."
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          echo "☣️ Applying namespace.c Fake Patch (if applicable)"
          if grep -q '^#include <trace/hooks/blk.h>$' fs/namespace.c; then
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
            NS_FAKE_PATCHED=1
          else
            echo "ℹ️ blk.h include not present in fs/namespace.c — skipping fake patch"
            NS_FAKE_PATCHED=0
          fi

          echo "☣️ Applying task_mmu.c Fake Patch (if applicable)"
          if grep -q '^#include <trace/hooks/mm.h>$' fs/proc/task_mmu.c; then
            sed -i '/^#include <trace\/hooks\/mm.h>$/d' fs/proc/task_mmu.c
            MM_FAKE_PATCHED=1
          else
            echo "ℹ️ mm.h include not present in fs/proc/task_mmu.c — skipping fake patch"
            MM_FAKE_PATCHED=0
          fi

          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

          echo "🔧 Applying SUSFS kernel patch..."
          if patch -p1 < "$SUSFS_KERNEL_PATCH"; then
            echo "✅ SUSFS patch successfully applied"
          else
            echo "⚠️ SUSFS patch failed — copying files manually"
          fi

          echo "📄 Forcing SUSFS source injection..."

          # Always replace fs/susfs.c
          mkdir -p fs
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          echo "✔ Copied fs/susfs.c"

          # Always replace include/linux/susfs.h
          mkdir -p include/linux
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          echo "✔ Copied include/linux/susfs.h"

          # Also install missing susfs_def.h
          if [ -f susfs4ksu/kernel_patches/include/linux/susfs_def.h ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
            echo "✔ Copied include/linux/susfs_def.h"
          else
            echo "⚠️ susfs_def.h not found in repo"
          fi

          echo "🔍 Verifying SUSFS files..."
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [ -f "$f" ]; then echo "✔ Found: $f"; else echo "❌ Missing: $f"; fi
          done

          # Clean up SUSFS repo
          rm -rf susfs4ksu

          # Create symbolic link for drivers/kernelsu (if needed by build system)
          if [ ! -L "drivers/kernelsu" ]; then
            ln -sf ../KernelSU drivers/kernelsu
            echo "✔ Created drivers/kernelsu symlink"
          fi

          echo "✅ SUSFS build wiring verified"

          # Add SUSFS configs
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          echo "↩️ Reverting namespace.c Fake Patch (if applicable)"
          if [ "$NS_FAKE_PATCHED" = "1" ] && ! grep -q 'trace/hooks/blk.h' fs/namespace.c; then
            if grep -q '^#include "internal.h"$' fs/namespace.c; then
              sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' fs/namespace.c
              echo "✔ Restored blk.h include"
            else
              echo "⚠️ Anchor #include \"internal.h\" not found — could not restore blk.h include"
            fi
          else
            echo "ℹ️ Skipping blk.h restore (not fake-patched or already present)"
          fi

          echo "↩️ Reverting task_mmu.c Fake Patch (if applicable)"
          if [ "$MM_FAKE_PATCHED" = "1" ] && ! grep -q 'trace/hooks/mm.h' fs/proc/task_mmu.c; then
            if grep -q '^#include <linux/pkeys.h>$' fs/proc/task_mmu.c; then
              sed -i '/^#include <linux\/pkeys.h>$/a #include <trace/hooks/mm.h>' fs/proc/task_mmu.c
              echo "✔ Restored mm.h include"
            else
              echo "⚠️ Anchor #include <linux/pkeys.h> not found — could not restore mm.h include"
            fi
          else
            echo "ℹ️ Skipping mm.h restore (not fake-patched or already present)"
          fi

          echo "🎉 SUSFS fully integrated!"

      # ──────────────────────────────────────────────
      # 8. Basic kernel configs
      # ──────────────────────────────────────────────
      - name: "⚙️ Setup basic configs"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"

          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          EOF

          echo "✅ Basic configs added"

      - name: "📝 Append custom Makefile line"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile
          echo "Custom Makefile line added successfully"

      # ──────────────────────────────────────────────
      # 9. Build kernel
      # ──────────────────────────────────────────────
      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          LTO=${{ github.event.inputs.lto_type }} \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "📁 Copy kernel image"
        working-directory: ${{ env.WORK_DIR }}/out/dist
        run: |
          cp Image "${{ env.OUTPUT_NAME }}"

      - name: "📤 Upload kernel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kernel.name }}-${{ github.event.inputs.root_solution }}-kernel
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 7

  # ════════════════════════════════════════════════
  # Package & Release
  # ════════════════════════════════════════════════
  package-kernels:
    name: "📦 Package Kernels"
    runs-on: ubuntu-latest
    needs: [build-kernels]
    steps:
      - name: "📥 Download kernel artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: "📦 Create release package"
        run: |
          set -e

          ROOT="${{ github.event.inputs.root_solution }}"
          KNAME="${{ github.event.inputs.kernel_name }}"

          # Clone AnyKernel3
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b YASK AnyKernel3

          # Copy kernel images
          find ./artifacts -name "Image.*" -exec cp {} AnyKernel3/ \;

          # Determine root display name
          case "$ROOT" in
            resukisu) ROOT_DISPLAY="ReSukiSU" ;;
            kittisu)  ROOT_DISPLAY="KittiSU" ;;
            none)     ROOT_DISPLAY="No Root" ;;
            *)        ROOT_DISPLAY="$ROOT" ;;
          esac

          # Create banner
          cat > AnyKernel3/banner << BANNER_EOF
          ╔═════════════════════════════════════════════════════╗
          ║                                                     ║
          ║            GKI 5.15 Kernel Builder                  ║
          ║                                                     ║
          ║     Root Solution: ${ROOT_DISPLAY}                  ║
          ║     SUSFS: ${{ github.event.inputs.enable_susfs }}  ║
          ║     BBG: ${{ github.event.inputs.enable_bbg }}      ║
          ║     LTO: ${{ github.event.inputs.lto_type }}        ║
          ║                                                     ║
          ║     Build Date: $(date +'%Y-%m-%d')                 ║
          ║                                                     ║
          ╚═════════════════════════════════════════════════════╝
          Installing Kernel...
          BANNER_EOF

          # Create ZIP
          ZIP_NAME="AnyKernel3_${KNAME}-${ROOT_DISPLAY}-AIO_$(date +'%Y-%m-%d').zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ROOT_DISPLAY=$ROOT_DISPLAY" >> $GITHUB_ENV
          echo "✅ Package created: $ZIP_NAME"

      - name: "⬆️ Upload to GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          tag_name: "kernel-${{ github.event.inputs.kernel_name }}-${{ github.event.inputs.root_solution }}"
          name: "${{ github.event.inputs.kernel_name }} - ${{ env.ROOT_DISPLAY }}"
          body: |
            ## Kernel Build Info
            - **Root Solution**: ${{ env.ROOT_DISPLAY }}
            - **SUSFS**: ${{ github.event.inputs.enable_susfs }}
            - **BBG**: ${{ github.event.inputs.enable_bbg }}
            - **LTO**: ${{ github.event.inputs.lto_type }}
            - **Kernel**: Linux 5.15
            - **Android**: 13+

      - name: "📱 Send Telegram Notification"
        if: always()
        run: |
          ROOT="${{ env.ROOT_DISPLAY }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/kernel-${{ github.event.inputs.kernel_name }}-${{ github.event.inputs.root_solution }}"

          if [[ "${{ job.status }}" == "success" ]]; then
            MESSAGE="✅ *GKI 5.15 Kernel Released*

          📦 *Build Information:*
          • Kernel: \`Linux 5.15\`
          • Android: \`13+\`
          • Base: \`GKI & CLO\`
          • Root: \`${ROOT}\`
          • SUSFS: \`${{ github.event.inputs.enable_susfs }}\`
          • BBG: \`${{ github.event.inputs.enable_bbg }}\`
          • LTO: \`${{ github.event.inputs.lto_type }}\`

          🕐 *Build Date:* $(date '+%Y-%m-%d %H:%M:%S UTC')
          📦 *Package:* \`${{ env.ZIP_NAME }}\`

          ⬇️ [Download Here]($RELEASE_URL)"

            curl -s -X POST \
              -d chat_id=${{ secrets.TELEGRAM_CHANNEL_ID }} \
              --data-urlencode "text=${MESSAGE}" \
              -d parse_mode="Markdown" \
              -d disable_web_page_preview="true" \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_YASK_BOT_TOKEN }}/sendMessage"

          else
            FAILURE_MSG="❌ *GKI 5.15 Kernel Build Failed*

          📦 *Build Information:*
          • Root: \`${ROOT}\`
          • SUSFS: \`${{ github.event.inputs.enable_susfs }}\`

          🕐 *Failed at:* $(date '+%Y-%m-%d %H:%M:%S UTC')

          🔍 Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."

            curl -s -X POST \
              -d chat_id=${{ secrets.TELEGRAM_CHANNEL_ID }} \
              --data-urlencode "text=${FAILURE_MSG}" \
              -d parse_mode="Markdown" \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_YASK_BOT_TOKEN }}/sendMessage"
          fi
